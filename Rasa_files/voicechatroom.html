<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rasa Chat with Voice Selection</title>

<style>
  body { font-family: Arial; margin: 20px; }
  #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 5px; }
  .message { margin: 5px 0; padding: 5px; border-radius: 5px; max-width: 80%; }
  .user { background-color: #dcf8c6; text-align: right; margin-left: auto; }
  .bot { background-color: #f1f0f0; text-align: left; margin-right: auto; }
  .buttons { margin-top: 5px; }
  .btn { padding: 5px 10px; margin: 2px; cursor: pointer; border: none; border-radius: 3px; background-color: #0084ff; color: white; }
  .btn:hover { background-color: #005bb5; }
  #controls { margin-bottom: 5px; }
  #voice-select { margin-left: 5px; }
</style>

</head>
<body>

<!-- Chat UI -->
<div id="chat-box"></div>

<div id="controls">
  <input type="text" id="user-input" placeholder="Type a message..." />
  <button id="send-btn">Send</button>
  <button id="mic-btn">🎤</button>
  <select id="voice-select"></select>
</div>

<script>
/* ============================================
      🔧 CONFIGURATION (CHANGE HERE ONLY)
============================================ */

const CONFIG = {
    RASA_URL: "http://localhost:5005/webhooks/rest/webhook",  // <--- CHANGE THIS
    DEFAULT_LANGUAGE: "en-US",
    ENABLE_VOICE_OUTPUT: true,
    ENABLE_VOICE_INPUT: true,
    BOT_NAME: "Assistant",
    WELCOME_MESSAGE: "Hi, I am your assistant. You can type or speak to me."
};

/* ============================================
              INITIALIZATION
============================================ */

const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const micBtn = document.getElementById("mic-btn");
const voiceSelect = document.getElementById("voice-select");

// Random conversation ID
const conversationId = "user_" + Math.random().toString(36).substring(2, 10);

/* ============================================
          DISPLAY MESSAGES
============================================ */

function displayMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.innerHTML = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Display quick-reply buttons from Rasa
function displayButtons(buttons) {
    const container = document.createElement("div");
    container.className = "buttons";

    buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = b;
        btn.onclick = () => {
            sendMessage(b);
            container.remove();
        };
        container.appendChild(btn);
    });

    chatBox.appendChild(container);
    chatBox.scrollTop = chatBox.scrollHeight;
}

/* ============================================
       SEND MESSAGE TO RASA SERVER
============================================ */

async function sendMessage(message = null) {
    if (message === null) {
        message = input.value.trim();
        if (!message) return;
    }

    displayMessage(message, "user");

    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;
    micBtn.disabled = true;

    try {
        const res = await fetch(CONFIG.RASA_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender: conversationId, message })
        });

        const data = await res.json();

        data.forEach(msg => {
            if (msg.text) {
                displayMessage(msg.text, "bot");
                if (CONFIG.ENABLE_VOICE_OUTPUT) speak(msg.text);
            }
            if (msg.buttons) {
                const titles = msg.buttons.map(b => b.title);
                displayButtons(titles);
            }
        });

    } catch (err) {
        displayMessage("⚠️ Error connecting to Rasa server.", "bot");
    }

    input.disabled = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
    input.focus();
}

/* ============================================
               TEXT-TO-SPEECH
============================================ */

function populateVoices() {
    const synth = window.speechSynthesis;
    const voices = synth.getVoices();

    voiceSelect.innerHTML = "";
    voices.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
    });
}

populateVoices();
speechSynthesis.onvoiceschanged = populateVoices;

function speak(text) {
    if (!CONFIG.ENABLE_VOICE_OUTPUT) return;

    const synth = window.speechSynthesis;
    const voices = synth.getVoices();
    if (!voices.length) return;

    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = voices[voiceSelect.value] || voices[0];
    synth.speak(utter);
}

/* ============================================
            SPEECH RECOGNITION
============================================ */

function startListening() {
    if (!CONFIG.ENABLE_VOICE_INPUT) return;

    if (!("webkitSpeechRecognition" in window)) {
        alert("Your browser does not support speech recognition.");
        return;
    }

    const recognition = new webkitSpeechRecognition();
    recognition.lang = CONFIG.DEFAULT_LANGUAGE;

    recognition.onstart = () => {
        micBtn.textContent = "🎙️";
        micBtn.disabled = true;
    };

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        sendMessage(text);
    };

    recognition.onerror = () => {
        displayMessage("Could not hear you, try typing.", "bot");
    };

    recognition.onend = () => {
        micBtn.textContent = "🎤";
        micBtn.disabled = false;
    };

    recognition.start();
}

/* ============================================
                EVENT HANDLERS
============================================ */

sendBtn.onclick = () => sendMessage();
micBtn.onclick = () => startListening();
input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

/* ============================================
                WELCOME MESSAGE
============================================ */

displayMessage(CONFIG.WELCOME_MESSAGE, "bot");
if (CONFIG.ENABLE_VOICE_OUTPUT) speak(CONFIG.WELCOME_MESSAGE);

</script>
</body>
</html>
