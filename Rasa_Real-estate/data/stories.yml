  - action: utter_ask_info_type
  - intent: contact_info
  - action: utter_contact_info
  - action: utter_ask_email
  - intent: send_info_email
  - action: utter_ask_for_email
  - intent: provide_email
  - action: action_validate_user_email
  - action: action_send_contact_email
