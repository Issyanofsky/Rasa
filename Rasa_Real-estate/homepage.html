<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya - Real Estate</title>
    
    <!-- Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Widget CSS -->
    <link rel="stylesheet" href="rasa-widget.css">

    <style>
        /* --- Page Styling --- */
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #f4f7f9; /* soft light background */
            color: #333;
        }

        header {
            background: linear-gradient(90deg, #3498db, #2980b9);
            padding: 30px 20px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
        }

        main {
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        main h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        main p {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 40px;
        }

        /* Optional: add a placeholder image for real estate */
        .hero-img {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Maya - Real Estate</h1>
        <p>Your trusted partner in buying and selling homes</p>
    </header>

    <main>
        <h2>Welcome!</h2>
        <p>Hi, I’m Maya. Use the chat below to ask questions about available properties, schedule visits, or get guidance on buying and selling real estate. I’m here to help you make the best decisions for your dream home.</p>
        <img src="http://77.125.130.211:8000/real-estate.gif" alt="Real Estate House" class="hero-img"/>
    </main>

    <!-- Rasa Chat Widget -->
    <link rel="stylesheet" href="rasa-widget.css">
    <script src="rasa-widget.js"></script>

</body>
</html>
